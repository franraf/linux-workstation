```yaml
---
schema_version: "1.0"

phase:
  id: 01-installation
  name: Installation
  description: >
    Implementação da instalação base do Arch Linux para o perfil
    Dell Latitude E5470.
  status: draft

profile:
  id: dell-latitude-e5470
  manifest: ../profile.yaml

execution:
  order:
    - 01-prepare-install-media
    - 02-configure-firmware
    - 03-partition-disk
    - 04-create-luks
    - 05-create-btrfs
    - 06-create-subvolumes
    - 07-mount-filesystems
    - 08-install-base-system
    - 09-generate-fstab
    - 10-enter-chroot
    - 11-configure-time
    - 12-configure-localization
    - 13-configure-network
    - 14-configure-users
    - 15-configure-initramfs
    - 16-install-bootloader
    - 17-first-boot

  stop_on_error: true
  validate_after_each_step: true

steps:
  01-prepare-install-media:
    mode: manual
    destructive: false
    playbook: ../../../playbooks/01-installation/01-prepare-install-media.md
    reason: >
      A mídia deve ser preparada antes de iniciar a execução do perfil.

  02-configure-firmware:
    mode: manual
    destructive: false
    playbook: ../../../playbooks/01-installation/02-configure-firmware.md
    reason: >
      As opções de firmware não podem ser configuradas com segurança pelo
      ambiente de instalação.

  03-partition-disk:
    mode: script
    destructive: true
    confirmation: ERASE
    playbook: ../../../playbooks/01-installation/03-partition-disk.md
    entrypoint: 03-partition-disk/run.sh

  04-create-luks:
    mode: script
    destructive: true
    confirmation: ERASE
    playbook: ../../../playbooks/01-installation/04-create-luks.md
    entrypoint: 04-create-luks/run.sh

  05-create-btrfs:
    mode: script
    destructive: true
    confirmation: ERASE
    playbook: ../../../playbooks/01-installation/05-create-btrfs.md
    entrypoint: 05-create-btrfs/run.sh

  06-create-subvolumes:
    mode: script
    destructive: false
    playbook: ../../../playbooks/01-installation/06-create-subvolumes.md
    entrypoint: 06-create-subvolumes/run.sh

  07-mount-filesystems:
    mode: script
    destructive: false
    playbook: ../../../playbooks/01-installation/07-mount-filesystems.md
    entrypoint: 07-mount-filesystems/run.sh

  08-install-base-system:
    mode: script
    destructive: false
    playbook: ../../../playbooks/01-installation/08-install-base-system.md
    entrypoint: 08-install-base-system/run.sh

  09-generate-fstab:
    mode: script
    destructive: false
    playbook: ../../../playbooks/01-installation/09-generate-fstab.md
    entrypoint: 09-generate-fstab/run.sh

  10-enter-chroot:
    mode: orchestrated
    destructive: false
    playbook: ../../../playbooks/01-installation/10-enter-chroot.md
    reason: >
      Os passos seguintes serão executados dentro do sistema instalado por
      meio do orquestrador.

  11-configure-time:
    mode: script
    destructive: false
    context: chroot
    playbook: ../../../playbooks/01-installation/11-configure-time.md
    entrypoint: 11-configure-time/run.sh

  12-configure-localization:
    mode: script
    destructive: false
    context: chroot
    playbook: ../../../playbooks/01-installation/12-configure-localization.md
    entrypoint: 12-configure-localization/run.sh

  13-configure-network:
    mode: script
    destructive: false
    context: chroot
    playbook: ../../../playbooks/01-installation/13-configure-network.md
    entrypoint: 13-configure-network/run.sh

  14-configure-users:
    mode: interactive-script
    destructive: false
    context: chroot
    playbook: ../../../playbooks/01-installation/14-configure-users.md
    entrypoint: 14-configure-users/run.sh
    reason: >
      Senhas e outras credenciais deverão ser fornecidas interativamente e
      nunca armazenadas no perfil.

  15-configure-initramfs:
    mode: script
    destructive: false
    context: chroot
    playbook: ../../../playbooks/01-installation/15-configure-initramfs.md
    entrypoint: 15-configure-initramfs/run.sh

  16-install-bootloader:
    mode: script
    destructive: false
    context: chroot
    playbook: ../../../playbooks/01-installation/16-install-bootloader.md
    entrypoint: 16-install-bootloader/run.sh

  17-first-boot:
    mode: manual-validation
    destructive: false
    playbook: ../../../playbooks/01-installation/17-first-boot.md
    reason: >
      A reinicialização, remoção da mídia e autenticação inicial exigem
      participação do usuário.

validation:
  final_step: 17-first-boot
  required_before_next_phase: true

metadata:
  created_at: 2026-07-31
  last_review: 2026-07-31
```
