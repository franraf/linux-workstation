  05-backup:
    mode: manual
    destructive: false
    playbook: ../../../playbooks/05-operations/05-backup.md

  06-recovery:
    mode: manual
    destructive: true
    playbook: ../../../playbooks/05-operations/06-recovery.md

  07-disaster-recovery:
    mode: manual
    destructive: true
    playbook: ../../../playbooks/05-operations/07-disaster-recovery.md

  08-operations-validation:
    mode: validation
    destructive: false
