---
schema_version: "1.0"

phase:
  id: 02-system
  name: System
  description: >
    Configuração do sistema base da Linux Workstation para o perfil
    Dell Latitude E5470.
  status: draft

profile:
  id: dell-latitude-e5470
  manifest: ../profile.yaml

execution:
